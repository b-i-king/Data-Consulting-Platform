# Render "Blueprint" for the FastAPI backend (same host as the template repo).
# Render dashboard -> New -> Blueprint -> pick this repo. Then fill in the
# environment variables marked `sync: false` in the dashboard (they are secret).
services:
  - type: web
    name: data-consulting-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # gunicorn manages uvicorn workers; 120 s timeout leaves room for big files.
    startCommand: gunicorn api.main:app -w ${WEB_CONCURRENCY:-1} -k uvicorn.workers.UvicornWorker --timeout 120 --bind 0.0.0.0:$PORT
    # free = $0 for test runs: sleeps after 15 idle minutes (about a minute to
    # wake up) and has 512 MB of memory (the API uses about 270 MB). Switch to
    # `starter` (paid) before real clients use it, so it never sleeps.
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false        # optional for a test run: leave empty to keep accounts in memory
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false        # e.g. https://your-site.vercel.app
      - key: BOOKING_URL
        sync: false
      - key: PRICE_PER_RUNTIME_MINUTE_USD
        value: "0.50"
