# Render settings for the FastAPI backend, written as a file (same host as the
# template repo). You don't need this file: the usual setup is Render
# dashboard -> New -> Web Service, typing in the same values (step by step in
# docs/DEPLOYMENT.md, section 2). It stays here as the reference copy, and
# Render's optional "Blueprint" feature can read it directly. Keep it in step
# with docs/DEPLOYMENT.md. Variables marked `sync: false` are secret and are
# set in the dashboard.
services:
  - type: web
    name: data-consulting-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # gunicorn manages uvicorn workers; 120 s timeout leaves room for big files.
    # --max-requests restarts the worker every ~200 requests so memory used by
    # big uploads is returned (pandas doesn't always give it back on its own).
    startCommand: gunicorn api.main:app -w ${WEB_CONCURRENCY:-1} -k uvicorn.workers.UvicornWorker --timeout 120 --max-requests 200 --max-requests-jitter 50 --bind 0.0.0.0:$PORT
    # free = $0 for test runs: sleeps after 15 idle minutes (about a minute to
    # wake up) and has 512 MB of memory (the API uses about 270 MB). Switch to
    # `starter` (paid) before real clients use it, so it never sleeps.
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false        # optional for a test run: leave empty to keep accounts in memory
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false        # e.g. https://your-site.vercel.app
      - key: BOOKING_URL
        sync: false
      - key: CONSULTANT_EMAILS
        sync: false        # e.g. you@yourdomain.com (first = default consultant)
      - key: CONSULTANT_ACCESS_CODE
        sync: false        # a long secret; consultants type it when signing in
      - key: PRICE_PER_RUNTIME_MINUTE_USD
        value: "0.50"
      # 512 MB of memory: a 14 MB CSV peaks around 300-375 MB while cleaning and
      # building the dashboard, so keep uploads at 15 MB on the free and Starter
      # plans. Raise it (e.g. 50) on a plan with 2 GB+.
      - key: MAX_UPLOAD_MB
        value: "15"
      # Optional: let Vercel preview links call the API too, e.g.
      #   https://data-consulting-platform-.*\.vercel\.app
      - key: ALLOWED_ORIGIN_REGEX
        sync: false
