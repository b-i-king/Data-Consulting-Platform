# Dependabot: GitHub watches the libraries this project uses and opens a pull
# request when one has a known security hole (or a newer version). You review
# and merge them like any other change — nothing updates on its own.
# Turn on alerts too: GitHub -> Settings -> Code security -> Dependabot alerts.
version: 2
updates:
  - package-ecosystem: "pip"          # requirements.txt (the API)
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"          # web/package.json (the website)
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Held back on purpose (10/2026) — each breaks `npm run lint`. Remove a rule
    # once the tool it waits for supports the new version:
    #   * typescript 6.1+ / 7: typescript-eslint (used by eslint-config-next)
    #     supports TypeScript up to 6.0 only.
    #   * eslint 10: eslint-plugin-jsx-a11y (our accessibility rules,
    #     eslint.config.mjs) supports ESLint up to 9 only.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
  - package-ecosystem: "github-actions"   # the versions of the actions in .github/workflows
    directory: "/"
    schedule:
      interval: "monthly"
