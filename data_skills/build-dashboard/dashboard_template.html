<!doctype html>
<!--
  Self-contained dashboard written by data_skills/build-dashboard/skill.py.
  The skill replaces __TITLE__ and __DATA__; everything else is plain HTML/CSS/JS
  with no outside files, so the result can be emailed or opened offline.

  Layout: overview cards (total, transactions) and a "transactions over time"
  line chart; then one card + line chart per KPI (the most common transaction
  types); then a category breakdown. The date range and comparison live in a
  bar fixed at the bottom of the screen (like Copilot Money). Filters applied
  when the file was made are listed at the top. Light/dark follows the computer.
  Chart colors were checked with the dataviz palette validator (both themes).
-->
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #f0f2f5; --surface: #ffffff; --line: #d9dde3; --ink: #111827; --muted: #5f6675;
    --brand: #a07c1e; --cur: #a07c1e; --prev: #4f6fb8; --good: #2b8a3e; --bad: #c92a2a;
    --mono: ui-monospace, "Fira Code", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1117; --surface: #1a1d26; --line: #2e3244; --ink: #e8e8e8; --muted: #9aa0ae;
            --brand: #c8ac44; --cur: #a68a2c; --prev: #6f8fd8; --good: #69db7c; --bad: #ff8787; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font: 600 24px/1.2 var(--mono); margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 20px; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--surface); border: 1px solid var(--line);
         border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 999px;
                font: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--brand); color: #111; font-weight: 600; }
  select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
           border-radius: 10px; padding: 6px 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .card .k { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .card .v { font: 600 26px/1.3 var(--mono); margin-top: 4px; }
  .delta { font-size: 13px; color: var(--muted); }
  .delta .up { color: var(--good); font-weight: 600; } .delta .down { color: var(--bad); font-weight: 600; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font: 600 15px/1.3 var(--mono); margin: 0 0 8px; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--line);
         border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 20px rgb(0 0 0 / .2); display: none; }
  .tip b { font: 600 13px var(--mono); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td { font-family: var(--mono); }
  .scroll { max-height: 320px; overflow: auto; }
  .bar { height: 10px; border-radius: 0 4px 4px 0; background: var(--cur); }
  .note { color: var(--muted); font-size: 12px; }
  .section-title { font: 600 15px/1.3 var(--mono); margin: 24px 0 10px; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .kpi-grid .card svg { margin-top: 8px; }
  .card.pick { cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .card.pick[aria-pressed="true"] { border-color: var(--brand); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
  .chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
  /* Copilot Money-style time bar: floats at the bottom of the screen while you scroll. */
  .timebar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10;
             display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: calc(100% - 24px);
             background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px;
             box-shadow: 0 10px 30px rgb(0 0 0 / .25); }
  .timebar .seg { border: 0; padding: 0; }
  main { padding-bottom: 120px; }
  /* Phones: two rows (ranges, comparisons), each scrolls sideways instead of wrapping. */
  @media (max-width: 760px) {
    .timebar { left: 12px; right: 12px; transform: none; flex-direction: column; flex-wrap: nowrap;
               align-items: stretch; border-radius: 20px; }
    .timebar .seg { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; }
    .timebar .seg button { white-space: nowrap; padding: 6px 10px; }
  }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="chips" id="filters" aria-label="Filters applied"></div>

  <div class="cards" id="overviewCards"></div>
  <section class="panel">
    <h2 id="chartTitle"></h2>
    <div class="legend"><span><i style="background:var(--cur)"></i>This period</span>
      <span id="prevLegend"><i style="background:var(--prev)"></i><span></span></span></div>
    <svg id="chart" viewBox="0 0 900 300" role="img" aria-label="Line chart"></svg>
    <p class="note" id="chartNote"></p>
    <details><summary class="note">Values by period</summary><div class="scroll"><table id="periods"></table></div></details>
  </section>

  <h2 class="section-title" id="kpiTitle"></h2>
  <div class="kpi-grid" id="kpis"></div>

  <section class="panel" id="breakdownPanel" style="margin-top:16px">
    <h2 id="breakdownTitle"></h2>
    <table id="breakdown"></table>
  </section>
</main>

<!-- Date range + comparison, fixed at the bottom of the screen. -->
<div class="timebar" role="group" aria-label="Date range and comparison">
  <div class="seg" id="ranges" aria-label="Date range"></div>
  <div class="seg" id="comparisons" aria-label="Comparison"></div>
</div>
<div class="tip" id="tip"></div>

<script>
const D = __DATA__;
const state = { range: D.default_range, cmp: D.default_comparison, overview: D.overview[D.overview.length - 1] };
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const fmt = (v) => v == null ? "—" : Number(v).toLocaleString("en-US", { maximumFractionDigits: Math.abs(v) < 100 ? 2 : 0 });
const pct = (v) => v == null ? "n/a" : (v >= 0 ? "+" : "") + (v * 100).toFixed(1) + "%";
const usDate = (iso) => { const [y, m, d] = iso.split("-"); return `${m}/${d}/${y}`; };
const PERIOD = { dod: "day", wow: "week", mom: "month" };

function deltaNode(p) {
  const span = el("div", null, "delta");
  if (p == null) { span.textContent = "no previous period"; return span; }
  const s = el("span", (p >= 0 ? "▲ " : "▼ ") + pct(p), p >= 0 ? "up" : "down");
  span.append(s, document.createTextNode(" vs. previous"));
  return span;
}

function buttons(container, labels, key) {
  container.replaceChildren();
  for (const [id, label] of Object.entries(labels)) {
    const b = el("button", label); b.type = "button";
    b.setAttribute("aria-pressed", String(state[key] === id));
    b.onclick = () => { state[key] = id; render(); };
    container.append(b);
  }
}

function render() {
  const R = D.ranges[state.range];
  // Day-over-day isn't available on very long ranges: fall back to week over week.
  if (!R.series[state.cmp]) state.cmp = R.series.wow ? "wow" : "mom";
  const cmpLabels = Object.fromEntries(Object.entries(D.comparison_labels).filter(([k]) => R.series[k]));
  buttons($("ranges"), D.range_labels, "range");
  buttons($("comparisons"), cmpLabels, "cmp");

  const w = R.window;
  $("title").textContent = D.title;
  $("sub").textContent = `${D.range_labels[state.range]}: ${usDate(w.start)} – ${usDate(w.end)}` +
    (w.prev_start ? ` · compared with ${usDate(w.prev_start)} – ${usDate(w.prev_end)}` : "") +
    ` · data as of ${usDate(D.as_of)}`;
  const f = Object.entries(D.filters || {});
  $("filters").replaceChildren(...(f.length ? f.map(([c, v]) => el("span", `${D.filter_labels[c] || c}: ${v.join(", ")}`, "chip"))
                                            : [el("span", "All customers", "chip")]));

  // Overview cards (total, transactions): click one to chart it.
  $("overviewCards").replaceChildren(...D.overview.map((m) => {
    const k = R.kpis[m], c = el("button", null, "card pick"); c.type = "button";
    c.setAttribute("aria-pressed", String(state.overview === m));
    c.onclick = () => { state.overview = m; render(); };
    c.append(el("div", D.metric_labels[m], "k"), el("div", fmt(k.current), "v"), deltaNode(k.pct_change));
    return c;
  }));
  const rows = R.series[state.cmp][state.overview];
  $("chartTitle").textContent = `${D.metric_labels[state.overview]} over time — ${D.comparison_labels[state.cmp]}`;
  $("prevLegend").style.display = w.prev_start ? "" : "none";
  $("prevLegend").lastChild.textContent = w.prev_start ? `Previous period (${usDate(w.prev_start)} – ${usDate(w.prev_end)})` : "";
  drawChart($("chart"), rows, 300);
  const partial = rows.length > 1 && rows[rows.length - 1].partial;
  $("chartNote").textContent = partial ? "The last period is still in progress (the data ends partway through it), so it is drawn faded. Use Month to date or Year to date for a like-for-like comparison." : "";

  const t = $("periods"); t.replaceChildren();
  const head = el("tr"); ["Period", "Value", `Previous ${PERIOD[state.cmp]}`, "Change", "% change", "Previous range"].forEach((h) => head.append(el("th", h)));
  t.append(head);
  [...rows].reverse().forEach((r) => {
    const tr = el("tr");
    tr.append(el("td", usDate(r.period) + (r.partial ? " (partial)" : "")), el("td", fmt(r.value)),
              el("td", fmt(r.previous)), el("td", fmt(r.change)), el("td", pct(r.pct_change)), el("td", fmt(r.prior_range)));
    t.append(tr);
  });

  // One card + line chart per KPI (the most common transaction types).
  $("kpiTitle").textContent = D.kpis.length ? (D.kpi_column_label ? `Top ${D.kpi_column_label.toLowerCase()}s · ${D.value_label.toLowerCase()}` : "Key metrics") : "";
  $("kpis").replaceChildren(...D.kpis.map((m) => {
    const k = R.kpis[m], c = el("div", null, "card");
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 900 260"); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", `${D.metric_labels[m]} line chart`);
    c.append(el("div", D.metric_labels[m], "k"), el("div", fmt(k.current), "v"), deltaNode(k.pct_change), svg);
    setTimeout(() => drawChart(svg, R.series[state.cmp][m], 260), 0);
    return c;
  }));

  // Breakdown by category.
  const b = D.breakdown[state.range] || [];
  $("breakdownPanel").style.display = b.length ? "" : "none";
  if (b.length) {
    $("breakdownTitle").textContent = `${D.metric_labels[D.breakdown_metric]} by ${D.dimension_column}`;
    const max = Math.max(...b.map((x) => x.current), 1);
    const bt = $("breakdown"); bt.replaceChildren();
    const h = el("tr"); [D.dimension_column, "", "Value", "% change"].forEach((x) => h.append(el("th", x))); bt.append(h);
    b.forEach((x) => {
      const tr = el("tr"), bar = el("div", null, "bar"), cell = el("td");
      bar.style.width = `${(x.current / max) * 100}%`; cell.style.width = "40%"; cell.append(bar);
      tr.append(el("td", x.category), cell, el("td", fmt(x.current)), el("td", pct(x.pct_change)));
      bt.append(tr);
    });
  }
}

function drawChart(svg, rows, H) {
  const W = 900, L = 64, Rm = 16, T = 12, B = 32;
  svg.replaceChildren();
  const NS = "http://www.w3.org/2000/svg", mk = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };
  if (!rows.length) { const t = mk("text", { x: W / 2, y: H / 2, "text-anchor": "middle", fill: "var(--muted)" }); t.textContent = "No data in this range"; svg.append(t); return; }
  const vals = rows.flatMap((r) => [r.value, r.prior_range]).filter((v) => v != null);
  const max = Math.max(...vals, 0), min = Math.min(...vals, 0);
  const x = (i) => L + (rows.length === 1 ? (W - L - Rm) / 2 : (i / (rows.length - 1)) * (W - L - Rm));
  const y = (v) => T + (1 - (v - min) / (max - min || 1)) * (H - T - B);

  // Recessive solid hairline grid + y labels.
  for (let g = 0; g <= 4; g++) {
    const v = min + ((max - min) * g) / 4;
    svg.append(mk("line", { x1: L, x2: W - Rm, y1: y(v), y2: y(v), stroke: "var(--line)", "stroke-width": 1 }));
    const t = mk("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }); t.textContent = fmt(v); svg.append(t);
  }
  // A few x labels (first, middle, last).
  [0, Math.floor((rows.length - 1) / 2), rows.length - 1].forEach((i) => {
    const t = mk("text", { x: x(i), y: H - 8, "text-anchor": i === 0 ? "start" : i === rows.length - 1 ? "end" : "middle", "font-size": 11, fill: "var(--muted)" });
    t.textContent = usDate(rows[i].period); svg.append(t);
  });
  const path = (key) => rows.map((r, i) => r[key] == null ? null : `${x(i)},${y(r[key])}`).filter(Boolean).join(" ");
  svg.append(mk("polyline", { points: path("prior_range"), fill: "none", stroke: "var(--prev)", "stroke-width": 2, "stroke-linejoin": "round" }));
  // The current line. If the last period is unfinished (partial), draw its final
  // segment faded with a hollow end point so it doesn't read as a real drop.
  const last = rows.length - 1, isPartial = rows.length > 1 && rows[last].partial;
  const full = isPartial ? rows.slice(0, last) : rows;
  svg.append(mk("polyline", { points: full.map((r, i) => `${x(i)},${y(r.value)}`).join(" "), fill: "none", stroke: "var(--cur)", "stroke-width": 2, "stroke-linejoin": "round" }));
  if (isPartial) {
    svg.append(mk("line", { x1: x(last - 1), y1: y(rows[last - 1].value), x2: x(last), y2: y(rows[last].value), stroke: "var(--cur)", "stroke-width": 2, opacity: 0.4 }));
    svg.append(mk("circle", { cx: x(last), cy: y(rows[last].value), r: 4, fill: "var(--surface)", stroke: "var(--cur)", "stroke-width": 2 }));
  }

  // Crosshair + tooltip: snaps to the nearest period, lists both series.
  const hair = mk("line", { y1: T, y2: H - B, stroke: "var(--muted)", "stroke-width": 1, visibility: "hidden" });
  const dot = mk("circle", { r: 4, fill: "var(--cur)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" });
  svg.append(hair, dot);
  const hit = mk("rect", { x: L, y: T, width: W - L - Rm, height: H - T - B, fill: "transparent", tabindex: 0 });
  svg.append(hit);
  const tip = $("tip");
  const show = (i, cx, cy) => {
    const r = rows[i];
    hair.setAttribute("x1", x(i)); hair.setAttribute("x2", x(i)); hair.setAttribute("visibility", "visible");
    dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(r.value)); dot.setAttribute("visibility", "visible");
    tip.replaceChildren(el("div", usDate(r.period) + (r.partial ? " (partial)" : "")));
    const line1 = el("div"); line1.append(el("b", fmt(r.value)), document.createTextNode(" this period"));
    const line2 = el("div"); line2.append(el("b", fmt(r.prior_range)), document.createTextNode(" previous range" + (r.prior_period ? ` (${usDate(r.prior_period)})` : "")));
    const line3 = el("div", `${pct(r.pct_change)} ${D.comparison_labels[state.cmp].toLowerCase()}`);
    tip.append(line1, line2, line3);
    tip.style.display = "block"; tip.style.left = `${cx + 14}px`; tip.style.top = `${cy + 14}px`;
  };
  hit.addEventListener("pointermove", (e) => {
    const box = svg.getBoundingClientRect(), px = ((e.clientX - box.left) / box.width) * W;  // screen -> chart units
    const i = Math.max(0, Math.min(rows.length - 1, Math.round(((px - L) / (W - L - Rm)) * (rows.length - 1))));
    show(i, e.clientX, e.clientY);
  });
  hit.addEventListener("pointerleave", () => { tip.style.display = "none"; hair.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); });
  hit.addEventListener("focus", () => { const b = svg.getBoundingClientRect(); show(rows.length - 1, b.right - 200, b.top); });
  hit.addEventListener("blur", () => { tip.style.display = "none"; });
}

render();
</script>
</body>
</html>
